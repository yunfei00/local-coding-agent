name: Windows installer candidate

on:
  push:
    branches: [feature/v1.0-windows-release]
    paths:
      - agent/**
      - desktop/**
      - scripts/build/**
      - scripts/validation/desktop-smoke.cjs
      - scripts/validation/packaged_agent_smoke.py
      - scripts/validation/packaged_gui_smoke.py
      - scripts/validation/v10-permission-desktop.cjs
      - scripts/validation/v10-plan-a-desktop.cjs
      - scripts/validation/packaged_chat_smoke.cjs
      - pyproject.toml
      - uv.lock
      - package.json
      - .github/workflows/windows-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      LCA_REQUIRE_INTERACTIVE_DESKTOP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop test dependencies
        run: npm --prefix desktop ci --no-audit --no-fund
      - name: Build, install, restart and uninstall candidate
        shell: pwsh
        run: ./scripts/build/package-windows.ps1 -ReuseDependencies
      - name: Verify isolated upgrade from v1.0.1
        if: github.ref_name == 'feature/v1.1-release-candidate'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.1 --pattern '*-x64-Setup.exe' --pattern SHA256SUMS.txt --dir build/upgrade-baseline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $previous = Get-Item build/upgrade-baseline/Local-Coding-Agent-1.0.1-x64-Setup.exe
          $checksum = (Get-Content build/upgrade-baseline/SHA256SUMS.txt | Where-Object { $_.EndsWith($previous.Name) }).Split(' ')[0]
          if ((Get-FileHash $previous.FullName).Hash -ne $checksum) { throw 'Previous installer SHA256 mismatch' }
          git fetch origin tag v1.0.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git worktree add --detach build/upgrade-source v1.0.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $candidate = Get-Item desktop/release/Local-Coding-Agent-1.1.0-x64-Setup.exe
          ./scripts/validation/v10-upgrade.ps1 -PreviousInstaller $previous.FullName -PreviousSource build/upgrade-source -CandidateInstaller $candidate.FullName -PreviousVersion 1.0.1 -CandidateVersion 1.1.0 -PreviousSchema 7
      - name: Retain candidate and isolated acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-candidate-${{ github.sha }}
          retention-days: 14
          path: |
            desktop/release/*-x64-Setup.exe
            desktop/release/*-x64-Portable.exe
            desktop/release/SHA256SUMS.txt
            build/packaged-*-smoke.json
            validation-reports/desktop-smoke.json
            build/v10-upgrade-*/report.json
