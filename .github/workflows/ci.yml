name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  checks:
    name: Core checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Electron headless test display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Python compile check
        shell: bash
        if: runner.os != 'Windows'
        run: uv run python -m compileall agent

      - name: Python compile check
        shell: pwsh
        if: runner.os == 'Windows'
        run: uv run python -m compileall agent

      - name: PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            ".\scripts\dev\start.ps1",
            ".\scripts\dev\bootstrap.ps1",
            ".\scripts\build\package-windows.ps1",
            ".\scripts\validation\upgrade-v0.1-to-v0.2.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              throw "PowerShell syntax validation failed: $file"
            }
          }

      - name: Python tests
        shell: bash
        if: runner.os != 'Windows'
        run: uv run python -m unittest discover -s tests -v

      - name: Python tests
        shell: pwsh
        if: runner.os == 'Windows'
        run: uv run python -m unittest discover -s tests -v

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Desktop typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Desktop tests
        working-directory: desktop
        run: npm run test

      - name: Desktop build
        working-directory: desktop
        run: npm run build

      - name: Actual desktop task and regression smoke
        if: runner.os == 'Windows'
        run: node scripts/validation/desktop-smoke.cjs

      - name: Retain M2 project execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-project-evidence-${{ matrix.os }}
          path: validation-reports/m2-project-*.json
          if-no-files-found: ignore

      - name: Retain sanitized M3 desktop evidence (never screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-desktop-evidence-${{ matrix.os }}
          path: validation-reports/m3-*.json
          if-no-files-found: ignore
