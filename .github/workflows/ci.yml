name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  checks:
    name: Core checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create project virtual environment
        run: uv venv --python 3.12 .venv

      - name: Install Python dependencies
        run: uv pip install -e .

      - name: Python compile check
        run: uv run --no-project python -m compileall agent

      - name: Python tests
        run: uv run --no-project python -m unittest discover -s tests -v

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Desktop typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Desktop tests
        working-directory: desktop
        run: npm run test

      - name: Desktop build
        working-directory: desktop
        run: npm run build
