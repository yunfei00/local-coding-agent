name: Release Windows

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
    paths:
      - ".github/release-trigger"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release ref and version
        shell: pwsh
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $desktop = Get-Content .\desktop\package.json -Raw | ConvertFrom-Json
          $root = Get-Content .\package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($desktop.version)"

          if ($root.version -ne $desktop.version) {
            throw "Root version $($root.version) does not match Desktop version $($desktop.version)."
          }

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag $env:GITHUB_REF_NAME does not match expected $expectedTag."
            }
          }
          elseif ($env:GITHUB_REF_NAME -eq "main") {
            $expectedCommitMessage = "release: $expectedTag"
            if ($env:RELEASE_COMMIT_MESSAGE -ne $expectedCommitMessage) {
              throw "Main release commit must be exactly '$expectedCommitMessage'."
            }

            $trigger = (Get-Content ".github\release-trigger" -Raw).Trim()
            if ($trigger -ne $expectedTag) {
              throw "Release trigger $trigger does not match expected $expectedTag."
            }

            $existingTag = git ls-remote --tags origin "refs/tags/$expectedTag"
            if ($existingTag) {
              throw "Tag $expectedTag already exists."
            }
          }
          else {
            throw "Unsupported release ref: $env:GITHUB_REF"
          }

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop test dependencies
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Build and validate Windows package
        shell: pwsh
        run: .\scripts\build\package-windows.ps1 -ReuseDependencies

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $desktop = Get-Content .\desktop\package.json -Raw | ConvertFrom-Json
          $releaseTag = "v$($desktop.version)"
          $assets = @(
            (Get-ChildItem ".\desktop\release\Local-Coding-Agent-*-x64-Setup.exe").FullName
            (Get-ChildItem ".\desktop\release\Local-Coding-Agent-*-x64-Portable.exe").FullName
            (Get-Item ".\desktop\release\SHA256SUMS.txt").FullName
          )
          if ($assets.Count -ne 3) {
            throw "Expected Setup, Portable and SHA256SUMS release assets."
          }

          if ($desktop.version -eq '1.0.0') {
            $gate = Get-Content docs/v1.0/release-gate.json -Raw | ConvertFrom-Json
            if ($gate.status -ne 'PASS' -or -not $gate.installed_full_access_components -or -not $gate.installer_current_windows -or -not $gate.upgrade_uninstall -or -not $gate.updater_plan_a) { throw 'v1.0 最终方案A发布验收尚未全部通过' }
          }
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw '发布提交不在 main 历史中' }
          $runs = gh run list --workflow ci.yml --commit $env:GITHUB_SHA --json conclusion,status --limit 10 | ConvertFrom-Json
          if (-not ($runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' })) { throw '发布提交缺少成功 CI' }
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release 已存在；禁止覆盖正式产物' }
          if ($desktop.version -eq '1.0.0') {
            $documents = @('windows-installer.md','user-guide.md','release-notes.md','acceptance-report.md')
            foreach ($document in $documents) {
              $source = Join-Path 'docs/v1.0' $document
              Copy-Item $source (Join-Path 'desktop/release' $document)
              $assets += (Get-Item (Join-Path 'desktop/release' $document)).FullName
            }
          }
          $notes = if ($desktop.version -eq '1.0.0') { @('--notes-file','docs/v1.0/release-notes.md') } else { @('--generate-notes') }
          gh release create $releaseTag @assets --draft --target $env:GITHUB_SHA --title "Local Coding Agent $releaseTag" @notes
          if ($LASTEXITCODE -ne 0) { throw '创建草稿 Release 失败' }
          $actual = gh release view $releaseTag --json assets | ConvertFrom-Json
          if ($actual.assets.Count -ne $assets.Count) { throw '草稿产物数量不完整；保留草稿且不发布' }
          gh release edit $releaseTag --draft=false
          if ($LASTEXITCODE -ne 0) { throw '发布 Release 失败；检查草稿状态' }
