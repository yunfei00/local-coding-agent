name: Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/v0.1-mvp"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Windows x64 package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build\package-windows.ps1

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Local-Coding-Agent-v0.1.0-Windows-x64
          if-no-files-found: error
          path: |
            desktop/release/Local-Coding-Agent-0.1.0-x64-Setup.exe
            desktop/release/Local-Coding-Agent-0.1.0-x64-Portable.exe
            desktop/release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $artifacts = @(
            "desktop/release/Local-Coding-Agent-0.1.0-x64-Setup.exe",
            "desktop/release/Local-Coding-Agent-0.1.0-x64-Portable.exe",
            "desktop/release/SHA256SUMS.txt"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $artifacts --clobber
          } else {
            gh release create $tag $artifacts --title "Local Coding Agent $tag" --generate-notes
          }
