[project]
name = "local-coding-agent"
version = "1.1.0"
description = "Local-first coding agent core"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "httpx2>=2.13,<3",
    "mcp>=2.3,<2.4",
    "pathspec>=0.12,<1",
    "pillow>=12.1,<13",
    "pywinauto>=0.6.9,<0.7 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
office = ["openpyxl>=3.1,<4", "python-docx>=1.1,<2", "python-pptx>=1.0,<2"]
office-windows = ["pywin32>=306; sys_platform == 'win32'"]
browser = ["playwright>=1.50,<2"]
packaging = [
    "pyinstaller==6.22.3"
]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
"agent.core" = ["workflow_templates.json"]
