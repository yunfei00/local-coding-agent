[project]
name = "local-coding-agent"
version = "0.4.2"
description = "Local-first coding agent core"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "httpx2>=2.13,<3",
    "mcp>=2.3,<2.4",
    "pillow>=12.1,<13",
    "pywinauto>=0.6.9,<0.7 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
packaging = [
    "pyinstaller==6.22.3"
]

[tool.setuptools.packages.find]
include = ["agent*"]
