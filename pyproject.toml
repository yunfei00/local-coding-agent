requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4"
]

[project.optional-dependencies]
packaging = [
    "pyinstaller==6.22.3"
]

[tool.setuptools.packages.find]
include = ["agent*"]
